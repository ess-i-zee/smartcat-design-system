<!--
  One-pager / Logo strip — reference template
  Wrap in .op-band (compact padding, layer-0) directly below the hero.
-->
<div class="op-band" data-layer="0" data-padding="compact">
  <div class="op-logo-strip">
    <p class="op-logo-strip__intro">Fortune 1,000 leaders trust Smartcat to keep training programs on schedule.</p>
    <div class="op-logo-strip__grid">
      <!-- Real client logos from images/client-logos/, first N of the
           preferred order in its README. Never the Smartcat wordmark. -->
      <img class="op-logo-strip__logo" src="../../../images/client-logos/lg.svg" alt="LG">
      <img class="op-logo-strip__logo" src="../../../images/client-logos/clarins.svg" alt="Clarins">
      <img class="op-logo-strip__logo" src="../../../images/client-logos/smith-and-nephew.svg" alt="Smith+Nephew">
      <img class="op-logo-strip__logo" src="../../../images/client-logos/stanley-black-and-decker.svg" alt="Stanley Black &amp; Decker">
      <img class="op-logo-strip__logo" src="../../../images/client-logos/loreal.svg" alt="L&rsquo;Or&eacute;al">
      <img class="op-logo-strip__logo" src="../../../images/client-logos/sp-global.svg" alt="S&amp;P Global">
    </div>
  </div>
</div>
