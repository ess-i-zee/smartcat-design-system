<!--
  One-pager / Logo strip — reference template
  Wrap in .op-band (compact padding, layer-0) directly below the hero.
-->
<div class="op-band" data-layer="0" data-padding="compact">
  <div class="op-logo-strip">
    <p class="op-logo-strip__intro">Fortune 1,000 leaders trust Smartcat to keep training programs on schedule.</p>
    <div class="op-logo-strip__grid">
      <img class="op-logo-strip__logo" src="logo-1.svg" alt="Client name">
      <img class="op-logo-strip__logo" src="logo-2.svg" alt="Client name">
      <img class="op-logo-strip__logo" src="logo-3.svg" alt="Client name">
      <img class="op-logo-strip__logo" src="logo-4.svg" alt="Client name">
      <img class="op-logo-strip__logo" src="logo-5.svg" alt="Client name">
      <img class="op-logo-strip__logo" src="logo-6.svg" alt="Client name">
    </div>
  </div>
</div>
