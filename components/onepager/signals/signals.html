<!--
  One-pager / Signals — reference template
  Wrap in .op-band; precede with a plain section heading.

  Labeled variant — the few signals that carry the most weight:
-->
<div class="op-signals">
  <div class="op-signals__item">
    <h3 class="op-signals__label">The key signal</h3>
    <p class="op-signals__text">&ldquo;Once the design is finished, someone still has to manually turn it into all the versions we need.&rdquo;</p>
  </div>
  <div class="op-signals__item">
    <h3 class="op-signals__label">Also strong</h3>
    <p class="op-signals__text">&ldquo;The design is done, but it takes another 1&#8211;2 weeks to get the page live.&rdquo;</p>
  </div>
</div>

<!-- Pill variant — a longer list, two columns, no headings: -->
<div class="op-signals" data-columns="2">
  <div class="op-signals__item" data-variant="pill">
    <p class="op-signals__text">&ldquo;Every market does its own version.&rdquo;</p>
  </div>
  <div class="op-signals__item" data-variant="pill">
    <p class="op-signals__text">&ldquo;We manage it in spreadsheets.&rdquo;</p>
  </div>
</div>
