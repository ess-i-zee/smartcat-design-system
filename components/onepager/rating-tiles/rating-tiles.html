<!--
  One-pager / Rating tiles — reference template
  Typically wrapped in .op-band data-theme="dark".
-->
<div class="op-band" data-theme="dark">
  <div class="op-rating-tiles">

    <div class="op-rating-tiles__tile" data-variant="gauge">
      <div class="op-rating-tiles__ring" style="--op-rating-value: 96">
        <div class="op-rating-tiles__ring-inner">
          <span class="op-rating-tiles__ring-value">9.6</span>
        </div>
      </div>
      <p class="op-rating-tiles__label">Ease of setup for global learning teams</p>
    </div>

    <div class="op-rating-tiles__tile" data-variant="gauge">
      <div class="op-rating-tiles__ring" style="--op-rating-value: 92">
        <div class="op-rating-tiles__ring-inner">
          <span class="op-rating-tiles__ring-value">9.2</span>
        </div>
      </div>
      <p class="op-rating-tiles__label">Accuracy powered by expert-enabled AI Agents</p>
    </div>

    <div class="op-rating-tiles__tile" data-variant="wide">
      <span class="op-rating-tiles__wide-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 18.3334C14.6025 18.3334 18.3334 14.6025 18.3334 10.0001C18.3334 5.39771 14.6025 1.66675 10.0001 1.66675C5.39771 1.66675 1.66675 5.39771 1.66675 10.0001M2.5 6.66675H8.33333M2.5 13.3334H8.33333" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      <div class="op-rating-tiles__wide-text">
        <p class="op-rating-tiles__value">1,000+</p>
        <p class="op-rating-tiles__label">Enterprises operating in fast-moving, global markets</p>
      </div>
    </div>

  </div>
</div>
