<!--
  One-pager / Hero — reference template
  Self-sufficient — place directly as the document's opening element,
  never inside .op-band. See onepager/hero/hero.css.

  .op-hero__tag is a content toggle: include 0, 1, or 2 floating
  annotation pills over the screenshot, omit entirely if the screenshot
  doesn't need one.
-->
<header class="op-hero">
  <div class="op-hero__topbar">
    <img class="op-hero__logo" src="../../../images/smartcat-logo-white.svg" alt="Smartcat">
    <button class="btn" data-type="secondary" data-size="m" type="button">
      <span class="btn__label">Schedule a demo</span>
    </button>
  </div>
  <div class="op-hero__row">
    <div class="op-hero__content">
      <h1 class="op-hero__headline">Review Less.<br>Catch More.<br>Improve Every Time.</h1>
      <p class="op-hero__paragraph">Smartcat's Reviewer Agent pre-reviews translated content before it reaches your team, flagging only what requires human judgment.</p>
    </div>
    <div class="op-hero__media">
      <div class="op-media">
        <img src="placeholder-screenshot.png" alt="">
      </div>
      <span class="op-hero__tag" style="top: 12%; right: 8%;">Translation</span>
      <span class="op-hero__tag" style="top: 26%; right: 20%;">Translation review</span>
    </div>
  </div>
</header>
