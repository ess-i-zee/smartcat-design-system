<!--
  Dropdown list — reference template
  Figma: Components / Atomic / Dropdown list

  Three components compose the system:
    .dropdown-list    — container with border, shadow, and padding
    .dropdown-search  — optional search bar; place as the first child if used
    .dropdown-item    — each selectable option

  ── .dropdown-list ───────────────────────────────────────
  Configure with:
    data-size="l|m"   — size; set the same value on each child

  Content (element presence):
    .dropdown-search (first child) — include for has-search
    .dropdown-item   (one or more) — include each option

  ── .dropdown-search ─────────────────────────────────────
  Configure with:
    data-size="l|m"

  Elements (always present):
    .dropdown-search__input — <input type="text"> for typing
    .dropdown-search__icon  — trailing search icon (16×16 SVG)

  ── .dropdown-item ───────────────────────────────────────
  Configure with:
    data-size="l|m"
    data-state="selected"   — selected item (persistent state)

  Content (element presence):
    .dropdown-item__checkbox      — include for has-checkbox;
                                    shows filled tick when data-state="selected"
    .dropdown-item__leading-icon  — include for has-leading-icon (16×16 SVG)
    .dropdown-item__label         — always present
    .dropdown-item__trailing-icon — include for has-trailing-icon (16×16 SVG)

  Interactive states (CSS / no data attribute needed):
    :hover         — Hover
    :active        — Active
    :focus-visible — Focused (purple focus ring)
-->
