<!--
  Document / Steps — reference template
  First step shown with a screenshot; second without.
-->
<div class="doc-steps">
  <div class="doc-steps__step">
    <span class="doc-steps__number">1</span>
    <div class="doc-steps__body">
      <p class="doc-steps__text">Receive an email from your Workspace Admin that invites you to review a project in that workspace.</p>
      <div class="doc-screenshot">
        <img src="screenshot.png" alt="">
      </div>
    </div>
  </div>
  <div class="doc-steps__step">
    <span class="doc-steps__number">2</span>
    <div class="doc-steps__body">
      <p class="doc-steps__text">Open the email to review the details of the task, including the administrator who invited you.</p>
    </div>
  </div>
</div>

<!-- Icon-led variant: for an unordered row list rather than a literal sequence. -->

    </span>
