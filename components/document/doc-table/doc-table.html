<!--
  Document / Table — reference template
  A row-label column plus two value columns (data-columns="2", the
  default). Omit .doc-table__corner and the row-head cells entirely for
  a table with no row labels.
-->
<table class="doc-table">
  <thead>
    <tr>
      <td class="doc-table__corner"></td>
      <th class="doc-table__col-head" scope="col">First option</th>
      <th class="doc-table__col-head" scope="col">Second option</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th class="doc-table__row-head" scope="row">Best for</th>
      <td class="doc-table__cell">What the first option suits.</td>
      <td class="doc-table__cell">What the second option suits.</td>
    </tr>
    <tr>
      <th class="doc-table__row-head" scope="row">Goal</th>
      <td class="doc-table__cell">The first option&rsquo;s objective.</td>
      <td class="doc-table__cell">The second option&rsquo;s objective.</td>
    </tr>
  </tbody>
</table>
