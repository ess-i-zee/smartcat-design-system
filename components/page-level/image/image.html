<!--
  Image — section reference template
  Figma: Sections / Image (node-id=4499-3894)

  A full-width image row, centered, capped at the content width (1120px).
  Configure with data-layout on .image:
    data-layout="wide"    — picture spans the content width
    data-layout="narrow"  — picture inset to ~740px on desktop+tablet;
                            full-width on mobile

  Swap the .image__placeholder span for a real <img class="image__media">.
  The 16:9 placeholder uses the design-system "image" icon (24x24).
-->

<div class="image" data-layout="wide">

    <div class="image__frame">

</div>
