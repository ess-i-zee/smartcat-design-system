<!--
  Customer logos — section reference template
  Figma: Sections / Client logos chain (node-id=9499-13645)

  Properties:
    data-type : carousel (auto-marquee, centered "Trusted by:")
              | 1-line   (label + single row)
              | 2-line   (brand-led sentence + two-row grid)
  Elements (include or omit):
    .customer-logos__header — label / sentence
    .customer-logos__logo   — one per logo (placeholder box; swap for <img>)
  Carousel: duplicate the full logo set in markup so the -50% loop is seamless.
  No atomics reused.
-->

<!-- Carousel — auto-scrolling marquee (logo set duplicated for a seamless loop) -->
<div class="customer-logos" data-type="carousel">
  <div class="customer-logos__inner">
    <p class="customer-logos__header">Trusted by:</p>
    <div class="customer-logos__viewport">
      <div class="customer-logos__track">
        <span class="customer-logos__logo">Logo</span>
        <span class="customer-logos__logo">Logo</span>
        <span class="customer-logos__logo">Logo</span>
        <span class="customer-logos__logo">Logo</span>
        <span class="customer-logos__logo">Logo</span>
        <span class="customer-logos__logo">Logo</span>
        <span class="customer-logos__logo">Logo</span>
        <span class="customer-logos__logo">Logo</span>
        <!-- duplicate set -->
        <span class="customer-logos__logo" aria-hidden="true">Logo</span>
        <span class="customer-logos__logo" aria-hidden="true">Logo</span>
        <span class="customer-logos__logo" aria-hidden="true">Logo</span>
        <span class="customer-logos__logo" aria-hidden="true">Logo</span>
        <span class="customer-logos__logo" aria-hidden="true">Logo</span>
        <span class="customer-logos__logo" aria-hidden="true">Logo</span>
        <span class="customer-logos__logo" aria-hidden="true">Logo</span>
        <span class="customer-logos__logo" aria-hidden="true">Logo</span>
      </div>
    </div>
  </div>
</div>
